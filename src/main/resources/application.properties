spring.application.name=FeatureFlagSystem
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/FeatureFlagSystem}
spring.datasource.username=${DB_USERNAME:vantablack}
spring.datasource.password=${DB_PASSWORD:dbpassword}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
security.jwt.secret=${JWT_SECRET:replace-this-with-a-long-secret-key-for-jwt-signing-1234567890}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
